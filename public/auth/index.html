<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <link rel="stylesheet" href="./login.css">
</head>

<body>
 <!-- VOLTAR PARA O INÍCIO -->
    <a href="../home/index.html">Voltar para o inicio</a>


     <!-- CARD -->
    <div class="container">


         <!-- LOGO -->
        <div class="logo"><img src="/img/WhatsApp Image 2026-09-14 at 19.55.03.jpeg" alt="logo"></div>


         <!-- TÍTULO -->
         <h1>Academa</h1>


         <!-- BOTÕES - ENTRAR / CRIAR CONTA -->
         <div class="tabs">
            <button class="active">Entrar</button>
            <button class="conta">Criar Conta</button>
        </div>


        <!-- FORMULARIO -->
        <form>
            <div>
                <label for="email">E-MAIL</label><br>
                <input type="email" id="email" name="email" placeholder="seu@email.com">
            </div>

            <div>
                <label for="senha">SENHA</label><br>
                <input type="password"id="senha" name="senha" placeholder="********">
            </div>


            <!-- CRIAR MINHA CONTA -->
             <button class="btn-a-conta">Criar minha conta</button>
             </form>


             <!-- DIVISOR OU -->
            <div class="divisor">
            <span></span>
            <p>OU</p>
            <span></span>
            </div>  

            <!-- LOGIN SOCIAL -->
            <div class="social">

            <button><img src="/img/apple-black-logo.png" alt="apple">Apple</button>

            <button><img src="/img/github.png"alt="github">GitHub</button>

            </div>
            
            <!-- MENSAGEM DE SEGURANÇA -->
            <div class="segurança">
                <p>Proteção cognitiva ativada nesta sessão</p>

            </div>
        
    </div>


     <div class="footer">
    <p>© 2026 Academa. Proteção cognitiva ativa e aprendizado sustentável para desenvolvedores.</p>
    </div>

<script src="https://cdn.userway.org/widget.js" data-account="free"></script>

<script>
    document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;
        
        if (email === "admin@gmail.com" && senha === "123") {
            window.location.href = "../explorar/index.html";
        } else {
            alert("Erro: E-mail ou senha inválidos.");
        }
    });
</script>
</body>

</html>
